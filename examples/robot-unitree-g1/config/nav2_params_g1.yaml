# G1 Nav2 configuration.
# Unitree G1 humanoid: ~1.2 m tall, narrow foot-based footprint (~0.25 x 0.20 m).
# Bipedal locomotion via SDK2 LocoClient — holonomic-capable (can side-step)
# but side-step speed is limited. max_linear_x: 1.0 m/s, max_angular: 2.0 rad/s.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      allow_unknown: false

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    controller_frequency: 10.0
    failure_tolerance: 5.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # G1 step length ~0.3 m; generous terminal tolerance for bipedal arrival.
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"

      # RotationShim parameters
      rotate_to_goal_heading: true
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 2.0
      angular_dist_threshold: 0.52
      angular_disengage_threshold: 0.17
      simulate_ahead_time: 1.0

      # DWB embedded controller — G1 bipedal envelope.
      primary_controller: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: -0.5
      max_vel_x: 1.0
      max_vel_y: 0.5
      max_vel_theta: 2.0
      min_speed_xy: 0.01
      max_speed_xy: 1.0
      min_speed_theta: 0.1
      acc_lim_x: 1.5
      acc_lim_y: 1.5
      acc_lim_theta: 3.0
      decel_lim_x: -1.5
      decel_lim_y: -1.5
      decel_lim_theta: -3.0
      vx_samples: 20
      vy_samples: 10
      vtheta_samples: 60
      sim_time: 2.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
                "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 1.0
      GoalAlign.scale: 0.3
      PathDist.scale: 0.5
      GoalDist.scale: 2.0
      RotateToGoal.scale: 0.5
      RotateToGoal.slowing_factor: 2.0
      RotateToGoal.lookahead_time: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    bt_loop_duration: 50
    default_server_timeout: 1000
    default_bt_xml_filename: "__ROBONIX_BT_XML__"
    default_nav_to_pose_bt_xml: "__ROBONIX_BT_XML__"
    default_nav_through_poses_bt_xml: "__ROBONIX_BT_THROUGH_POSES_XML__"
    tf_buffer_duration: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # G1 footprint: two feet on a line; inflation handles sideways margin.
      footprint: "[[0.20, 0.0], [-0.20, 0.0]]"
      footprint_padding: 0.05

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: "__ROBONIX_SCAN_TOPIC__"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 8.0
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.50
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30
        cost_scaling_factor: 5.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.20, 0.0], [-0.20, 0.0]]"
      footprint_padding: 0.05
      update_frequency: 10.0
      publish_frequency: 10.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: "__ROBONIX_MAP_TOPIC__"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: "__ROBONIX_SCAN_TOPIC__"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_range: 8.0
          raytrace_range: 12.0
          inf_is_valid: true
          observation_persistence: 0.0
          expected_update_rate: 0.50
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30
        cost_scaling_factor: 5.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
