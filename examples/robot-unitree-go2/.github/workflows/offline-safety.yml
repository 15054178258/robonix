name: offline-safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Check out pinned sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
      - name: Use Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Install offline-test parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate without ROS, DDS, SDK initialization, or hardware
        run: ./scripts/validate_offline.sh
