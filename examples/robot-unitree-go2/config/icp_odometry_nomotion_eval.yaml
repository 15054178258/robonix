/robonix/nomotion/icp_eval/icp_odometry:
  ros__parameters:
    # Diagnostic-only frame contract.  The existing base_link is required to
    # transform the MID-360 frames, but the odometry parent is deliberately
    # private and publish_tf=false prevents any TF message from being emitted.
    # The runner additionally remaps RTAB-Map's eagerly-created TF endpoint to
    # /robonix/nomotion/icp_eval/tf_disabled.
    frame_id: base_link
    odom_frame_id: robonix_nomotion_icp_odom
    publish_tf: false
    publish_null_when_lost: true
    use_sim_time: false

    # Go2 sensor relay contracts.  Both publishers use sensor-data QoS.
    qos: 2
    qos_imu: 2
    wait_for_transform: 1.5
    wait_imu_to_init: true
    always_check_imu_tf: true
    approx_sync: false
    topic_queue_size: 30
    sync_queue_size: 30

    # This first stationary evaluation does not attempt motion deskewing.  It
    # is intentionally the same conservative 3-DoF ICP family already used by
    # service-map-rbnx when external odometry is absent.
    deskewing: false
    deskewing_slerp: true
    Reg/Strategy: "1"
    Reg/Force3DoF: "true"
    Icp/VoxelSize: "0.1"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "20"
    Icp/PointToPlaneRadius: "0"
    # Match the deploy-owned Go2 RTAB-Map profile instead of the generic
    # service launch's 1.0 m fallback.
    Icp/MaxCorrespondenceDistance: "0.20"
    Icp/MaxTranslation: "0.20"
    Icp/MaxRotation: "0.35"
    Icp/CorrespondenceRatio: "0.01"
    # A single bad stationary registration previously seeded RTAB-Map's
    # default constant-velocity extrapolator, after which the guess diverged
    # by about 0.10 m on every cloud. Never extrapolate that unverified motion;
    # reset immediately after a lost registration so later stationary frames
    # can recover independently.
    Odom/GuessMotion: "false"
    Odom/ResetCountdown: "1"
    Odom/ScanKeyFrameThr: "0.4"
    OdomF2M/ScanSubtractRadius: "0.1"
    OdomF2M/ScanMaxSize: "15000"
    OdomF2M/BundleAdjustment: "false"
