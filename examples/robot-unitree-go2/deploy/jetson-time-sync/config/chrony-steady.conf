# Ephemeral, Go2-only slew configuration.  There is intentionally no
# makestep directive: this profile cannot introduce a deliberate clock step.
refclock SOCK /run/robonix-go2-time/refclock/go2.sock refid GO2 poll 0 filter 64 prefer trust

driftfile /run/robonix-go2-time/state/drift
pidfile /run/robonix-go2-time/state/chronyd.pid
bindcmdaddress /run/robonix-go2-time/control/chronyd.sock
cmdport 0
port 0
