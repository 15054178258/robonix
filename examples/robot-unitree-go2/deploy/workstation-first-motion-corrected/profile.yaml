# Declarative contract only: this is intentionally not a runnable Robonix
# manifest. A runtime manifest must be rendered into a private directory and
# paired with a fresh one-time permit before the provider can start.
profile: workstation-first-motion-corrected-v1
state_topic: /robonix/time_corrected/motion/sportmodestate
state_fallback_topic: ""
command_topic: /go2/commissioning/cmd_vel
canonical_command_topic: /cmd_vel
odom_topic: /odom
odom_source: external_verified
external_odom_topic: /robonix/time_corrected/raw/utlidar/robot_odom
publish_odom_tf: true
arm_service: /go2_chassis/arm
timestamp_discipline:
  profile: motion
  mode: affine
  required_streams: [sport_primary, mid360_imu, mid360_odom]
  excluded_streams: [mid360_cloud]
  max_stream_age_s: 0.20
  max_source_receipt_delta_s: 0.20
motion:
  max_linear_x_mps: 0.05
  max_linear_y_mps: 0.0
  max_angular_z_rps: 0.0
  max_duration_s: 2.0
  max_distance_m: 0.10
  command_timeout_s: 0.20
ownership:
  command_publisher: /go2_first_motion_probe
  command_subscriber: /go2_chassis_adapter
  canonical_cmd_vel_publishers: 0
permit:
  schema: robonix-go2-first-motion-permit-v1
  one_time: true
  max_lifetime_s: 300
  minimum_remaining_at_consume_s: 15
  evidence: [dds_identity, state, time]
post_stop:
  explicit_disarm_required: true
  daemon_armed: false
  guard_state: DISARMED
  continuous_stationary_observation_s: 1.0
  max_linear_speed_mps: 0.03
  max_yaw_rate_rps: 0.03
  max_pose_drift_m: 0.02
