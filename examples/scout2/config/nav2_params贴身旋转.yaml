# Scout2 Nav2 configuration.
# Uses robonix_nav2_terminal plugins (PersistentRotateToGoal, PersistentGoalChecker,
# GoalAwareNavfnPlanner) compiled in the nav2 Docker image.
# Scout2 chassis: 0.925 x 0.38 m; wheel outer edge: 0.827 x 0.700 m.
# Octagonal footprint covers chassis + all 4 wheels.
# max linear 0.3 m/s, max angular 0.6 rad/s.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "robonix_nav2_terminal::GoalAwareNavfnPlanner"
      # Prefer a zero-unknown route. If none exists for a known goal, accept
      # only a short map-coverage gap; larger unknown shortcuts are rejected.
      max_unknown_ratio: 0.05
      max_unknown_length: 0.75
      max_unknown_run: 0.40
    GridBased_known:
      tolerance: 0.5
      allow_unknown: false
    GridBased_unknown:
      tolerance: 0.5
      allow_unknown: true
    tf_buffer_duration: 0.5  # 秒


controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: "__ROBONIX_ODOM_TOPIC__"
    controller_frequency: 5.0
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 30.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    # general_goal_checker:
    #   plugin: "robonix_nav2_terminal::PersistentGoalChecker"
    #   xy_enter_tolerance: 0.30
    #   xy_exit_tolerance: 0.45
    #   yaw_enter_tolerance: 0.12
    #   yaw_exit_tolerance: 0.20
    #   stopped_linear_velocity: 0.05
    #   stopped_angular_velocity: 0.05

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.00
      min_vel_y: 0.0
      max_vel_x: 0.3
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.3
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_y: -0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 40
      sim_time: 3.0
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["PersistentRotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      # Was 1.0 — too dominant, caused over-correction on curved paths (circling).
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 12.0
      PersistentRotateToGoal.class: "robonix_nav2_terminal::PersistentRotateToGoalCritic"
      PersistentRotateToGoal.xy_enter_tolerance: 0.30
      PersistentRotateToGoal.xy_exit_tolerance: 0.45
      PersistentRotateToGoal.yaw_enter_tolerance: 0.25
      PersistentRotateToGoal.yaw_exit_tolerance: 0.30
      PersistentRotateToGoal.stopped_linear_velocity: 0.05
      PersistentRotateToGoal.max_terminal_angular_velocity: 0.30
      PersistentRotateToGoal.slowing_factor: 3.0
      PersistentRotateToGoal.lookahead_time: 0.5
      PersistentRotateToGoal.max_terminal_duration: 15.0
      PersistentRotateToGoal.no_progress_timeout: 3.0
      PersistentRotateToGoal.min_yaw_progress: 0.04
      # Was 0.50 — triggered rotation too early, interfering with path following.
      PersistentRotateToGoal.rotation_margin: 0.15


bt_navigator:
  ros__parameters:
    use_sim_time: false
    bt_loop_duration: 50
    default_server_timeout: 1000
    default_bt_xml_filename: "__ROBONIX_BT_XML__"
    default_nav_to_pose_bt_xml: "__ROBONIX_BT_XML__"
    # Was 0.5 — too short, TF lookup failures cause planning/control gaps.
    tf_buffer_duration: 10.0


recoveries_server:
  ros__parameters:
    costmap_topic: global_costmap/costmap
    footprint_topic: global_costmap/published_footprint


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      # Octagonal footprint covering chassis + wheels (from URDF).
      # Chassis corners: (±0.46, ±0.19). Wheel outer edges: x ±0.41, y ±0.35.
      footprint: "[[0.46, 0.19], [0.41, 0.35], [-0.41, 0.35], [-0.46, 0.19], [-0.46, -0.19], [-0.41, -0.35], [0.41, -0.35], [0.46, -0.19]]"
      footprint_padding: 0.02

      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: "__ROBONIX_SCAN_TOPIC__"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_range: 3.5
          raytrace_range: 4.5
          qos:
            reliability: best_effort
            durability: volatile

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # Must be >= inscribed_radius of the octagonal footprint (~0.25m).
        # 0.30m gives a safety margin over the 0.224m minimum edge distance.
        inflation_radius: 0.55
        cost_scaling_factor: 7.0


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      # Same octagonal footprint as local_costmap (chassis + wheels).
      footprint: "[[0.46, 0.19], [0.41, 0.35], [-0.41, 0.35], [-0.46, 0.19], [-0.46, -0.19], [-0.41, -0.35], [0.41, -0.35], [0.46, -0.19]]"
      footprint_padding: 0.05
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "__ROBONIX_MAP_TOPIC__"
        map_subscribe_transient_local: true
        enabled: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: "__ROBONIX_SCAN_TOPIC__"
          max_obstacle_height: 2.0
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 6.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.80
        cost_scaling_factor: 3.0
      always_send_full_costmap: true


lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - recoveries_server
