# Scout2 camera driver — primitive package.
# One device = one package. This driver exposes the scout2 RGB + depth camera:
#   robonix/primitive/camera/snapshot    → MCP JPEG snapshot (RGB)
#   robonix/primitive/camera/depth_snapshot → MCP JPEG snapshot (depth)
#   robonix/primitive/camera/driver      → gRPC lifecycle
#   robonix/primitive/camera/rgb         → ROS2 topic_in (Image)
#   robonix/primitive/camera/depth       → ROS2 topic_in (Image)
#   robonix/primitive/camera/extrinsics  → ROS2 topic_in (TransformStamped)
#   robonix/primitive/camera/intrinsics  → ROS2 topic_in (CameraInfo)

manifestVersion: 1

package:
  name: com.robonix.example.scout2_camera
  version: 0.1.0
  vendor: robonix
  description: Scout2 camera driver — RGB + depth camera driver.
  license: MulanPSL-2.0
  tags: [primitive, camera, rgbd, scout2, agilex]
  maintainers:
    - Szhu <szh@example.com>

build: bash scripts/build.sh
start: bash scripts/start.sh

stop: |
  pkill -TERM -f "[s]cout2_camera.*camera_driver" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[s]cout2_camera.*camera_driver" 2>/dev/null || true

capabilities:
  - name: robonix/primitive/camera/snapshot
  - name: robonix/primitive/camera/depth_snapshot
  - name: robonix/primitive/camera/driver
  - name: robonix/primitive/camera/rgb
  - name: robonix/primitive/camera/depth
  - name: robonix/primitive/camera/extrinsics
  - name: robonix/primitive/camera/intrinsics
