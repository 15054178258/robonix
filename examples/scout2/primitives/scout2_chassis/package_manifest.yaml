# Scout2 chassis driver — primitive package.
# One device = one package. This driver exposes the robot base/chassis:
#   robonix/primitive/chassis/move      → gRPC ExecuteMoveCommand(MoveCommand) → String
#   robonix/primitive/chassis/odom      → ROS2 topic_out (nav_msgs/Odometry, /odom)
#   robonix/primitive/chassis/twist_in  → ROS2 topic_in (geometry_msgs/Twist, /cmd_vel)
#   robonix/primitive/chassis/driver    → gRPC LifecycleDriver.Driver(INIT/PROBE/...)
#   robonix/primitive/health/state      → gRPC GetState(SCOUT2 health status)
#
# `*/driver` is the lifecycle interface every primitive should declare —
# `rbnx boot` calls Driver(CMD_INIT) after RegisterCapability, waits for
# ok=true, only then proceeds to next package. Skipping it means the boot
# silently passes through this package and tools may be exposed before
# the underlying robot is actually ready.

manifestVersion: 1

package:
  name: com.robonix.example.scout2_chassis
  version: 0.1.0
  vendor: robonix
  description: Scout2 chassis driver — odometry readout + velocity control over ROS2.
  license: MulanPSL-2.0
  tags: [primitive, chassis, scout2, agilex, mobile_base]
  maintainers:
    - Szhu <szh@example.com>

build: bash scripts/build.sh
start: bash scripts/start.sh

stop: |
  pkill -TERM -f "[s]cout2_chassis.*chassis_driver" 2>/dev/null || true
  sleep 1
  pkill -KILL -f "[s]cout2_chassis.*chassis_driver" 2>/dev/null || true

capabilities:
  - name: robonix/primitive/chassis/move
  - name: robonix/primitive/chassis/odom
  - name: robonix/primitive/chassis/twist_in
  - name: robonix/primitive/chassis/driver
