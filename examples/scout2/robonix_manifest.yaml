# Scout2 real-robot deployment manifest
#
# boot in sequence: system -> soma+soma+scene -> execution -> interaction
manifestVersion: 1

catalog:
  name: robonix.robot.agilex.scout2
  version: 0.1.0
  description: Robonix deployment for AgileX Scout2 mobile base with RGB-D camera and 2D/3D LiDAR.
  license: MulanPSL-2.0
  tags: [robot, deploy, scout2, agilex, mobile_base]
  maintainers:
    - Szhu <szh@example.com>

env:
  ROS_DOMAIN_ID: "0"
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp

system:
  # basic layer
  atlas:
    listen: 0.0.0.0:50051
    log: info
  # soma+scene layer
  soma:
    listen: 0.0.0.0:50091
    log: info
  vitals:
    listen: 0.0.0.0:50092
    log: info
  scene:
    log: info
    # Scout2 camera optical frame for scene 3D fusion
    camera_frame: camera_color_optical_frame
  # execution layer
  executor:
    listen: 0.0.0.0:50061
    log: info
  # interaction layer
  pilot:
    listen: 0.0.0.0:50071
    log: debug
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 0.0.0.0:50081
    log: info
    handsfree_enabled: false

# after booted all the system components, start the primitives
primitive:
  - name: audio_driver
    url: https://github.com/syswonder/primitive-audio-driver-rbnx
    branch: main
    config:
      mic_device: "hw:1,0"
      speaker_device: "plughw:0,3"
      speaker_sample_rate: 16000
      speaker_channels: 1
  - name: robot_description
    path: ./primitives/primitive-robot-description-rbnx
    manifest: package_manifest.native.yaml
  - name: scout2_chassis
    path: ./primitives/primitive-agilex-ranger_mini_v3-chassis-rbnx
    config:
      chassis_model: scout
      port_name: can0
      can_bitrate: 500000
      cmd_vel_topic: /cmd_vel
  - name: scout2_camera
    path: ./primitives/scout2_camera
    config:
      rgb_topic: /camera/camera/color/image_raw
      #depth_topic: /camera/camera/depth/image_rect_raw
      depth_topic: /camera/camera/aligned_depth_to_color/image_raw
      camera_info_topic: /camera/camera/color/camera_info
      extrinsics_topic: /camera/camera/extrinsics/depth_to_color
      base_frame: base_link
      # Intrinsics fallback — true CameraInfo on /camera/camera/color/camera_info
      # is preferred at runtime; these are used only if no CameraInfo topic is found.
      width: 424
      height: 240
      fx: 605.77
      fy: 605.39
      cx: 329.25
      cy: 259.08
  - name: scout2_lidar
    path: ./primitives/scout2_lidar
    config:
      scan_topic: /scan
      pointcloud_topic: /velodyne_points

# after booted all the primitives, start the services
service:
  # ── Memory services ──────────────────────────────────────────────────
  - name: memgraph
    path: ../../services/memory
    config:
      backend: memgraph

  - name: memory
    path: ${ROBONIX_SOURCE_PATH}/services/memsearch
    config:
      backend: sqlite

  # ── Speech ───────────────────────────────────────────────────────────
  #- name: speech
    #path: ${ROBONIX_SOURCE_PATH}/services/speech
    #config:
      #disable_whisper: true
      #funasr_device: cuda
      #tts_voice: zh-CN-XiaoxiaoNeural
      #default_speaker_provider_id: audio_driver

  # # ── Voiceprint ───────────────────────────────────────────────────────
  # - name: voiceprint
  #   path: ${ROBONIX_SOURCE_PATH}/services/voiceprint
  #   config: {}

  # ── Mapping — RTAB-Map based ────────────────────────────────────────
  - name: mapping
    path: ./services/service-map-rbnx
    config:
      webui_port: 8091
      # Production localization uses chassis odometry. The timestamped Mid360
      # cloud is deskewed against odom before RTAB-Map consumes it.
      # Use RGB for visual constraints and fuse depth with Mid360 occupancy.
      # Camera data stays inside RTAB-Map; Nav2 LaserScan remains lidar-only.
      # Use the chassis odom until a separately declared Mid360 LIO provider
      # passes the static-drift gate. RTAB-Map still fuses RGB-D and Mid360.
      deskew_lidar: true
      # Fuse the front Gemini depth projection with Mid360 in the 2D occupancy
      # grid. Nav2's LaserScan input remains lidar-only.
      occupancy_sources: [lidar]
      params_file: config/rtabmap_params.yaml
      sensor_providers:
        lidar3d: scout2_lidar
        odom: scout2_chassis
          #rgb: scout2_camera
          #depth: scout2_camera
  
  # ── Navigation — Nav2 ───────────────────────────────────────────────
  - name: nav2
    path: ./services/service-navigation-rbnx
    #url: https://github.com/syswonder/service-navigation-rbnx
    # branch: main
    config:
      params_file: config/nav2_params.yaml
      bt_xml_file: config/navigate.xml
      use_sim_time: false
      action_wait_s: 240.0
      guard_terminal_xy_m: 0.20
      dynamic_speed:
        max_linear_speed_mps: 0.5
        default_percentage: 75
        step_percentage: 20
        min_percentage: 20
      scan_projection:
        enabled: true
        min_height_m: 0.45
        max_height_m: 1.20
        range_max_m: 12.0
        self_filter_margin_m: 0.20
      provider_ids:
        map: mapping
        odom: scout2_chassis
        scan: scout2_lidar
        scan_cloud: scout2_lidar
          #topic_remap:
          #scan: ""        

# after booted all the services, register the skills
skill:
  - name: explore
    path: ./skills/skill-explore-rbnx
    #url: https://github.com/syswonder/skill-explore-rbnx
    #branch: main
    config:
      explore_mode: frontier
      timeout_s: 600
  - name: move
    path: ./skills/move
  - name: patrol
    path: ./skills/patrol
    config: {}
  - name: say_hello
    path: ./skills/say_hello
    config: {}
