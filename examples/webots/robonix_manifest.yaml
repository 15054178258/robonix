manifestVersion: 1
name: robonix-webots-example-deploy

# Default Webots boot starts a fresh live SLAM session. The map/room UI
# names and persists that session when the operator clicks Save; clicking
# Load later switches mapping to localization mode and binds scene objects +
# room annotations to the selected saved map. Do not set SCENE_MAP_ID here: a
# static default would make a first run look like a loaded map.

# boot in sequence: system -> soma+scene -> execution -> interaction
system:
  # basic layer
  atlas:
    listen: 0.0.0.0:50051
    log: info
  # soma+scene layer
  scene:
    config:
      perception:
        # Metric SI units. A removed object must be absent in three healthy,
        # depth-verified frames before it becomes missing. Sensor/model
        # outages and occlusion do not count as negative observations.
        period_s: 0.6
        # YOLO-World admission controls. Confidence is unitless [0, 1];
        # max_detections is the per-frame cap before SAM/ConceptGraphs.
        confidence_threshold: 0.30
        max_detections: 30
        # Two distinct RGB-D frames confirm a new persistent object. Multiple
        # overlapping hypotheses from one frame remain debug candidates and
        # cannot permanently pollute Scene memory.
        confirmation_min_unique_frames: 2
        # A single very strong observation may publish immediately. Set 0 to
        # disable this fast path; 0.65 is calibrated from the Office replay.
        confirmation_singleton_min_mean_confidence: 0.0
        visible_miss_frames: 3
        visibility_depth_margin_m: 0.10
        visibility_min_clear_samples: 3
        visibility_min_clear_fraction: 0.60
        visibility_max_projected_samples: 25
        object_ttl_s: 30.0
        label:
          # Require repeated, confidence-weighted evidence before a label is
          # navigation-grade or allowed to replace a stable track label.
          history_size: 20
          min_switch_observations: 2
          min_winner_share: 0.55
          switch_margin: 0.15
          # Webots A/B showed that YOLO-World often calls a glass window a
          # picture frame. Reuse ConceptGraphs' existing crop-level CLIP
          # feature as a conservative second opinion only for this reviewed
          # confusion pair; every other detector label is left untouched.
          clip_rerank:
            groups:
              - [window, picture frame]
            prompts:
              window:
                - an indoor glass window showing an outdoor view
                - a window installed in a wall
              picture frame:
                - a framed painting or photograph hanging on a wall
                - a picture frame containing artwork
            min_score: 0.20
            # Repeated office crops ranked the true window first with only
            # 0.001-0.004 cosine margin, while the real apartment painting
            # ranked picture-frame first. Keep the 0.20 absolute-score gate
            # and accept only a strict top-1 winner (ties never switch).
            min_margin: 0.0
          # The office world contains only PottedTree instances. Keep both
          # detector prompts but aggregate their evidence under one reviewed
          # deployment label instead of splitting plant/potted-plant tracks.
          aliases:
            plant: potted plant
            sofa: couch
        association:
          # Co-location is not proof of identity (for example, a cup on a
          # table). Webots uses exact-label tracks and disables the legacy
          # class-agnostic geometric collapse. Cross-label hypotheses are
          # allowed to reach ConceptGraphs' normal overlap + CLIP merge only
          # when both clouds are near-identical by all three strict gates.
          # These are competing hypotheses for one wall fixture, not semantic
          # aliases. Normal ConceptGraphs overlap + CLIP gates still decide
          # identity; this only prevents per-frame reranking from spawning
          # parallel tracks for the same physical crop.
          confusable_class_groups:
            - [window, picture frame]
            - [monitor, television]
          allow_cross_class_merge: false
          exact_duplicate_centroid_max_m: 0.15
          exact_duplicate_min_voxel_coverage: 0.40
          exact_duplicate_max_extent_ratio: 1.50
          coobserved_duplicate_min_shared_frames: 3
          coobserved_duplicate_min_median_iou: 0.85
          coobserved_duplicate_max_extent_ratio: 2.0
          coobserved_duplicate_min_visual_similarity: 0.90
          same_class_centroid_max_m: 0.15
          same_class_min_voxel_coverage: 0.50
          same_class_max_extent_ratio: 1.75
          same_class_disjoint_min_unique_frames: 2
          same_class_disjoint_max_frame_gap: 1
          same_class_disjoint_max_center_major_extent_ratio: 0.20
          same_class_disjoint_min_visual_similarity: 0.85
          same_class_merge_interval_ticks: 1
          identity_rebind_max_distance_m: 0.45
        geometry:
          # Reject RGB-D points outside the physical sensor range, remove
          # one-pixel SAM boundary leakage, denoise each frame, and admit only
          # point clouds that fit the current map grid.
          mask_erosion_px: 1
          min_depth_m: 0.15
          max_depth_m: 6.0
          depth_mad_scale: 3.5
          depth_min_band_m: 0.12
          frame_dbscan: true
          require_occupancy_bounds: true
          map_bounds_margin_m: 0.25
          map_max_outside_fraction: 0.20
          bbox_low_percentile: 5.0
          bbox_high_percentile: 95.0
          max_bbox_extent_m: 3.0
          # REP-105 map is fixed; live map<-odom correction must not move
          # historical object geometry already expressed in map.
          rebase_map_corrections: false
  # execution layer
  executor:
    listen: 127.0.0.1:50061
    log: info
  # interaction layer
  pilot:
    listen: 127.0.0.1:50071
    log: debug
    vlm:
      upstream: ${VLM_BASE_URL}
      api_key: ${VLM_API_KEY}
      model: ${VLM_MODEL}
      api_format: openai
  liaison:
    listen: 0.0.0.0:50081
    log: info
    # Disabled until the operator enables it from robonix-client. The client
    # then supplies its persisted input/output provider selection; no client
    # address is stored in this deployment.
    handsfree_enabled: false

# after booted all the system components, start the devices (primitives)
# the robonix boot "device tree"
primitive:
  - name: tiago_chassis
    path: ./primitives/tiago_chassis
    config:
      # example place holders
      can_port: /dev/can0
      odom_frame: odom
      base_frame: base_link
  - name: tiago_camera
    path: ./primitives/tiago_camera
    config:
      # example place holders
      serial_no: 1234567890
      fps: 30
      width: 640
      height: 480
      # Webots Tiago head camera calibration for the intrinsics contract.
      # The simulator does not publish CameraInfo, so the camera primitive
      # publishes this deployment-provided K on /tiago/camera/intrinsics.
      fx: 554.0
      fy: 554.0
      cx: 320.0
      cy: 240.0
      frame_id: head_front_camera_rgb_optical_frame
      # First-RGB-frame wait at INIT. Webots under a CPU-starved boot (all
      # drivers initialising at once) can take well over a minute to deliver
      # the first frame — lidar alone routinely needs ~70s — so the default
      # 60s is too tight here. Match the lidar tolerance with headroom.
      sentinel_timeout_s: 150
  - name: tiago_lidar
    path: ./primitives/tiago_lidar
    config:
      # example place holders
      update_rate: 10
      frame_id: lidar
  # ── audio mic/speaker source ─────────────────────────────────────────────
  # Local ALSA provider. It remains available for robot-local audio.
  - name: audio_driver
    path: ./primitives/audio_driver
    config: {}
  # Reverse bridge for a robonix-client audio route. It advertises its
  # endpoint through Atlas and waits for the client to connect, so neither
  # this manifest nor Liaison stores a client IP.
  - name: audio_client_bridge
    path: ./primitives/audio_client_bridge
    config:
      transport: reverse
      listen_port: 60002

# after booted all the primitives, start the services
service:
  # ── Memory services (two parallel backends) ──────────────────────────
  # Memgraph (Scribe Mem) — structured CKG memory (BM25 + Embedding).
  # Contracts: robonix/service/memory/{remember,hybrid_search,promote}
  # Embedding: all-MiniLM-L6-v2 (d=384), BM25 + Cosine hybrid retrieval.
  - name: memgraph
    path: ../../services/memory
    config:
      backend: memgraph

  # memsearch — default reference long-term-memory service for the
  # agent. Lives at services/memsearch in the robonix tree; pilot
  # queries it for relevant past context when planning.
  - name: memory
    path: ${ROBONIX_SOURCE_PATH}/services/memsearch
    config:
      backend: sqlite

  # speech — ASR + TTS. Provides robonix/service/speech/asr_stream + tts that
  # liaison's voice loop connects to. The selected audio provider is supplied
  # by the client for F2, voice steer, and hands-free turns.
  # disable_whisper => FunASR-only (Paraformer) streaming ASR path.
  - name: speech
    path: ${ROBONIX_SOURCE_PATH}/services/speech
    config:
      disable_whisper: true
      funasr_device: cuda
      tts_voice: zh-CN-XiaoxiaoNeural
      # CI and headless Webots have no connected reverse-audio client. Keep
      # the bridge available, but send default speech to the local provider.
      default_speaker_provider_id: audio_driver

  # voiceprint — ECAPA-TDNN speaker identification. Provides
  # robonix/service/voiceprint/{identify,enroll,list}: liaison's voice gate
  # stamps each Task with the identified user_id, and `rbnx chat`'s user
  # modal enrolls/lists speakers. Config is env-driven (port 50092,
  # threshold 0.25, device auto) so the manifest block stays empty.
  - name: voiceprint
    path: ${ROBONIX_SOURCE_PATH}/services/voiceprint
    config: {}

  # Mapping publishes the occupancy, point cloud, pose, and map-management
  # contracts consumed by Navigation and Scene.
  - name: mapping
    url: https://github.com/syswonder/service-map-rbnx
    branch: main
    config:
      use_sim_time: true
      # Use planar lidar for the persistent structural occupancy grid. RGB-D
      # remains an RTAB-Map registration/loop-closure input below; high
      # obstacles are maintained independently by Nav2's depth obstacle layer.
      occupancy_sources: [lidar]
      # Complete simulator tuning is owned by this deployment repository.
      # RTAB-Map also consumes RGB-D and the chassis odometry for SLAM.
      rtabmap_inputs: [lidar, rgbd, odom]
      params_file: config/rtabmap_params.yaml
      sensor_providers:
        lidar2d: tiago_lidar
        rgb: tiago_camera
        depth: tiago_camera
        odom: tiago_chassis

  # nav2_wrapper_rbnx IS the navigation service for this deploy.
  #
  # Wraps a standard Nav2 stack. Discovers its inputs through atlas — /map
  # (mapping/occupancy_grid), /odom (chassis/odom), /scan (lidar/lidar) —
  # and drives /cmd_vel via Nav2's navigate_to_pose action. Runs in the
  # `robonix-nav2` docker image (built by `rbnx build`, so the host needs
  # no ROS2). The complete simulator configuration is deployment-owned under
  # config/. Listed after
  # mapping (its /map provider); on_init returns Deferred until mapping is
  # up, so order is a convenience, not a hard requirement.
  - name: nav2
    url: https://github.com/syswonder/service-navigation-rbnx
    branch: main
    config:
      params_file: config/nav2_params.yaml
      use_sim_time: true
      action_wait_s: 240.0
      # The simulation goal checker enters at 0.25 m. Keep the terminal
      # rotation guard inside that boundary so path-alignment turns are not
      # mistaken for a stuck final-yaw correction.
      guard_terminal_xy_m: 0.20
      provider_ids:
        map: mapping
        odom: tiago_chassis
        scan: tiago_lidar

# after booted all the services, register the skills (but don't activate them now)
skill:
  # explore_rbnx — autonomous frontier exploration.
  - name: explore
    url: https://github.com/syswonder/skill-explore-rbnx
    branch: main
    config:
      # Do not let one unreachable frontier consume the entire exploration
      # budget inside Nav2 recovery. Progress is measured from the live
      # map-frame pose, not from world names or hard-coded waypoints.
      progress_watchdog:
        no_progress_timeout_s: 12.0
        min_translation_progress_m: 0.08
        min_rotation_progress_rad: 0.14
      frontier_recovery:
        retry_failed_after_s: 30.0
        # SI metres beyond the Soma footprint at a selected endpoint. Routes
        # still use the physical footprint, while endpoints avoid leaving
        # Nav2 inside an inscribed-cost band after a successful leg.
        endpoint_clearance_m: 0.10
